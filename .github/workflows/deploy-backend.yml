name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build all jars
        run: |
          mvn -B package -DskipTests

      - name: Upload backend jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          retention-days: 1
          path: |
            auth/target/*.jar
            profile/target/*.jar
            testApi/target/*.jar
            twitchService/target/*.jar
            wallet/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_PORT: ${{ secrets.SERVER_PORT }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: .

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh

          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY is not a valid private key."
            exit 1
          fi

          : > ~/.ssh/known_hosts
          if ssh-keyscan -p "${SSH_PORT}" -T 60 -t rsa,ecdsa,ed25519 "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            && grep -q '^[^#[:space:]]' ~/.ssh/known_hosts; then
            :
          elif [ -n "${SERVER_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::error::No host keys: ssh-keyscan failed and SERVER_KNOWN_HOSTS is empty."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p \"$REMOTE_PATH\""

      - name: Sync backend repository and jars to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.idea' \
            --exclude '.DS_Store' \
            --exclude 'logs' \
            -e "ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Upload backend .env
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_ENV_FILE}" ]; then
            echo "BACKEND_ENV_FILE secret not set; skipping .env upload"
            exit 0
          fi

          printf '%s\n' "$BACKEND_ENV_FILE" > .backend.env
          rsync -az \
            -e "ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            .backend.env "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.env"
          rm -f .backend.env

      - name: Deploy backend with Docker Compose
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PATH"

          mkdir -p logs

          # Деплоим только те сервисы, которые объявлены в compose с `build:`.
          # Это избавляет от хардкода: добавите новый сервис — он автоматически попадет в деплой.
          if command -v jq >/dev/null 2>&1; then
            SERVICES="$(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.build != null) | .key' | tr '\n' ' ')"
          else
            if ! command -v python3 >/dev/null 2>&1; then
              echo "::error::Neither jq nor python3 is available on the server to extract build services from docker-compose.yml"
              exit 1
            fi
            SERVICES="$(python3 - <<'PY'
            import json, subprocess
            cfg = json.loads(subprocess.check_output(["docker","compose","config","--format","json"]))
            services = cfg.get("services", {})
            deploy = [name for name, s in services.items() if s.get("build") is not None]
            print(" ".join(deploy))
            PY
            )"
          fi
          if [ -z "${SERVICES}" ]; then
            echo "::error::No build services found in docker-compose.yml; nothing to deploy."
            exit 1
          fi

          PROJECT_NAME="$(basename "$REMOTE_PATH")"

          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          export COMPOSE_PROGRESS=plain

          echo "== Free disk (before build) =="
          # Builder cache и неиспользуемые слои часто являются причиной "no space left on device".
          docker builder prune -af || true
          docker image prune -f || true

          echo "== Stop/remove containers (only deployed services) =="
          docker compose stop $SERVICES || true
          docker compose rm -f $SERVICES || true

          echo "== Remove old local images (only deployed services) =="
          for svc in $SERVICES; do
            IDS="$(docker images -q \
              --filter "label=com.docker.compose.project=$PROJECT_NAME" \
              --filter "label=com.docker.compose.service=$svc" || true)"
            # Fallback на случай если compose project name отличается от basename.
            if [ -z "${IDS}" ]; then
              IDS="$(docker images -q \
                --filter "label=com.docker.compose.service=$svc" || true)"
            fi
            if [ -n "${IDS}" ]; then
              docker rmi -f ${IDS} || true
            fi
          done

          echo "== Rebuild & start (only deployed services) =="
          docker compose up -d --build --no-deps --force-recreate $SERVICES
          docker compose ps
          EOF

      - name: Show backend logs on failure
        if: failure()
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          cd "$REMOTE_PATH" || exit 0
          docker compose logs --tail=200
          EOF