name: Deploy Backend Stack

on:
  push:
    branches: [ main ]
    paths:
      - 'auth/**'
      - 'profile/**'
      - 'testApi/**'
      - 'wallet/**'
      - 'octopusService/**'
      - 'fightService/**'
      - 'monitoring/**'
      - 'pom.xml'
      - 'docker-compose.backend.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      profile: ${{ steps.filter.outputs.profile }}
      testApi: ${{ steps.filter.outputs.testApi }}
      wallet: ${{ steps.filter.outputs.wallet }}
      octopusService: ${{ steps.filter.outputs.octopusService }}
      fightService: ${{ steps.filter.outputs.fightService }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed backend services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'auth/**'
              - 'pom.xml'
            profile:
              - 'profile/**'
              - 'pom.xml'
            testApi:
              - 'testApi/**'
              - 'pom.xml'
            wallet:
              - 'wallet/**'
              - 'pom.xml'
            octopusService:
              - 'octopusService/**'
              - 'pom.xml'
            fightService:
              - 'fightService/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B test -pl auth,profile,testApi,wallet,octopusService -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 14
          if-no-files-found: ignore

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [ detect, test ]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jars
        run: mvn -B package -DskipTests -pl auth,profile,testApi,wallet,octopusService -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.auth == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: auth/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/auth-service:main
            ghcr.io/${{ env.OWNER_LC }}/auth-service:sha-${{ github.sha }}

      - name: Build and push profile image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.profile == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: profile/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/profile-service:main
            ghcr.io/${{ env.OWNER_LC }}/profile-service:sha-${{ github.sha }}

      - name: Build and push test-api image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.testApi == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: testApi/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/test-api:main
            ghcr.io/${{ env.OWNER_LC }}/test-api:sha-${{ github.sha }}

      - name: Build and push wallet image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.wallet == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: wallet/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/wallet-service:main
            ghcr.io/${{ env.OWNER_LC }}/wallet-service:sha-${{ github.sha }}

      - name: Build and push octopus image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.octopusService == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: octopusService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/octopus-service:main
            ghcr.io/${{ env.OWNER_LC }}/octopus-service:sha-${{ github.sha }}

      - name: Build and push fight-service image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.fightService == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fightService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/fight-service:main
            ghcr.io/${{ env.OWNER_LC }}/fight-service:sha-${{ github.sha }}
          cache-from: type=gha,scope=fightService
          cache-to: type=gha,mode=max,scope=fightService

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client gettext-base

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.BACKEND_SERVER_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          if ssh-keyscan -p "${SSH_PORT}" -T 60 -t rsa,ecdsa,ed25519 "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            && grep -q '^[^#[:space:]]' ~/.ssh/known_hosts; then
            :
          elif [ -n "${SERVER_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::error::No host keys found."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p \"$REMOTE_PATH\""

      - name: Upload backend compose
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" docker-compose.backend.yml "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Upload backend .env
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BACKEND_ENV_FILE" > .backend.env
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" .backend.env "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.env"
          rm -f .backend.env

      - name: Upload monitoring stack
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p \"$REMOTE_PATH/monitoring\""

          printf '%s\n' "$BACKEND_ENV_FILE" > .backend.env
          set -a
          source .backend.env
          set +a
          rm -f .backend.env
          envsubst '${METRICS_USERNAME} ${METRICS_PASSWORD}' \
            < monitoring/main/prometheus.yml > .prometheus.rendered.yml

          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            .prometheus.rendered.yml "$SSH_USER@$SSH_HOST:$REMOTE_PATH/monitoring/prometheus.yml"
          rm -f .prometheus.rendered.yml
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            monitoring/main/loki-config.yaml \
            monitoring/main/alloy-config.alloy \
            monitoring/main/docker-compose.metrics.backend.yml \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/monitoring/"

      - name: Deploy monitoring stack
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          docker network inspect monitoring_net >/dev/null 2>&1 || docker network create monitoring_net
          cd "$REMOTE_PATH/monitoring"
          docker compose -f docker-compose.metrics.backend.yml --env-file "$REMOTE_PATH/.env" up -d
          EOF

      - name: Deploy backend stack
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PATH"
          mkdir -p logs/auth logs/profile logs/test-api logs/wallet logs/octopus
          chmod -R 777 logs
          echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin
          docker compose -f docker-compose.backend.yml up -d redis rabbitmq kafka
          docker compose -f docker-compose.backend.yml pull auth-service test-api profile-service wallet-service octopus-service fight-service
          docker compose -f docker-compose.backend.yml up -d auth-service test-api profile-service wallet-service octopus-service fight-service
          docker compose -f docker-compose.backend.yml ps
          EOF

      - name: Verify backend stack is healthy
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PATH"
          services="auth-service test-api profile-service wallet-service octopus-service fight-service"
          for i in \$(seq 1 36); do
            unhealthy=""
            for s in \$services; do
              cid=\$(docker compose -f docker-compose.backend.yml ps -q "\$s")
              if [ -z "\$cid" ]; then
                unhealthy="\$unhealthy \$s:missing"
                continue
              fi
              status=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "\$cid")
              if [ "\$status" != "healthy" ] && [ "\$status" != "none" ]; then
                unhealthy="\$unhealthy \$s:\$status"
              fi
            done
            if [ -z "\$unhealthy" ]; then
              echo "all services healthy"
              exit 0
            fi
            echo "waiting on:\$unhealthy"
            sleep 5
          done
          echo "timed out waiting for services to become healthy"
          exit 1
          EOF

      - name: Show backend logs on failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          cd "$REMOTE_PATH" || exit 0
          docker compose -f docker-compose.backend.yml logs --tail=200
          EOF
