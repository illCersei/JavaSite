name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_PORT: ${{ secrets.SERVER_PORT }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
      # Fallback if ssh-keyscan from GitHub to your server is blocked; use: ssh-keyscan -p PORT HOST
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh

          cat > ~/.ssh/id_ed25519 <<'EOF'
          ${{ secrets.SERVER_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519

          : > ~/.ssh/known_hosts
          if ssh-keyscan -p "${SSH_PORT}" -T 60 -t rsa,ecdsa,ed25519 "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            && grep -q '^[^#[:space:]]' ~/.ssh/known_hosts; then
            :
          elif [ -n "${SERVER_KNOWN_HOSTS}" ]; then
            : > ~/.ssh/known_hosts
            printf '%s\n' "${SERVER_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          else
            echo "::error::No host keys: ssh-keyscan failed (firewall/DNS?) and SERVER_KNOWN_HOSTS is empty."
            echo "For non-default port, paste output of: ssh-keyscan -p PORT HOST"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh -T -o BatchMode=yes -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_PATH'"

      - name: Sync backend repository to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'target' \
            --exclude '.idea' \
            --exclude '.DS_Store' \
            -e "ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Upload backend .env
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_ENV_FILE}" ]; then
            echo "BACKEND_ENV_FILE secret not set; skipping .env upload"
            exit 0
          fi
          printf '%s\n' "$BACKEND_ENV_FILE" > .backend.env
          rsync -az \
            -e "ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            .backend.env "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.env"
          rm -f .backend.env

      - name: Deploy backend with Docker Compose
        run: |
          ssh -T -o BatchMode=yes -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PATH"

          docker compose pull || true
          docker compose up -d --build --remove-orphans
          docker compose ps
          EOF

      - name: Show backend logs on failure
        if: failure()
        run: |
          ssh -T -o BatchMode=yes -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          cd "$REMOTE_PATH" || exit 0
          docker compose logs --tail=200
          EOF