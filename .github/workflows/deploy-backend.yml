name: Deploy Backend Stack

on:
  push:
    branches: [ main ]
    paths:
      - 'auth/**'
      - 'profile/**'
      - 'testApi/**'
      - 'wallet/**'
      - 'octopusService/**'
      - 'pom.xml'
      - 'docker-compose.backend.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      profile: ${{ steps.filter.outputs.profile }}
      testApi: ${{ steps.filter.outputs.testApi }}
      wallet: ${{ steps.filter.outputs.wallet }}
      octopusService: ${{ steps.filter.outputs.octopusService }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed backend services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            all:
              - 'pom.xml'
              - 'docker-compose.backend.yml'
            auth:
              - 'auth/**'
              - 'pom.xml'
            profile:
              - 'profile/**'
              - 'pom.xml'
            testApi:
              - 'testApi/**'
              - 'pom.xml'
            wallet:
              - 'wallet/**'
              - 'pom.xml'
            octopusService:
              - 'octopusService/**'
              - 'pom.xml'

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jars
        run: mvn -B package -DskipTests -pl auth,profile,testApi,wallet,octopusService -am

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.auth == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: auth/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/auth-service:main
            ghcr.io/${{ env.OWNER_LC }}/auth-service:sha-${{ github.sha }}

      - name: Build and push profile image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.profile == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: profile/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/profile-service:main
            ghcr.io/${{ env.OWNER_LC }}/profile-service:sha-${{ github.sha }}

      - name: Build and push test-api image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.testApi == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: testApi/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/test-api:main
            ghcr.io/${{ env.OWNER_LC }}/test-api:sha-${{ github.sha }}

      - name: Build and push wallet image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.wallet == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: wallet/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/wallet-service:main
            ghcr.io/${{ env.OWNER_LC }}/wallet-service:sha-${{ github.sha }}

      - name: Build and push octopus image
        if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.octopusService == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: octopusService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/octopus-service:main
            ghcr.io/${{ env.OWNER_LC }}/octopus-service:sha-${{ github.sha }}

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.BACKEND_SERVER_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          if ssh-keyscan -p "${SSH_PORT}" -T 60 -t rsa,ecdsa,ed25519 "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            && grep -q '^[^#[:space:]]' ~/.ssh/known_hosts; then
            :
          elif [ -n "${SERVER_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::error::No host keys found."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p \"$REMOTE_PATH\""

      - name: Upload backend compose
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" docker-compose.backend.yml "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Upload backend .env
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BACKEND_ENV_FILE" > .backend.env
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" .backend.env "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.env"
          rm -f .backend.env

      - name: Deploy backend stack
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PATH"
          mkdir -p logs/auth logs/profile logs/test_api logs/wallet logs/octopus
          echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin
          docker compose -f docker-compose.backend.yml up -d redis rabbitmq kafka
          docker compose -f docker-compose.backend.yml pull auth_service test_api profile_service wallet_service octopus_service
          docker compose -f docker-compose.backend.yml up -d auth_service test_api profile_service wallet_service octopus_service
          docker compose -f docker-compose.backend.yml ps
          EOF

      - name: Show backend logs on failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.BACKEND_SERVER_HOST }}
          SSH_PORT: ${{ secrets.BACKEND_SERVER_PORT }}
          SSH_USER: ${{ secrets.BACKEND_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          cd "$REMOTE_PATH" || exit 0
          docker compose -f docker-compose.backend.yml logs --tail=200
          EOF
