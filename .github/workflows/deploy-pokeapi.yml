name: Setup PokeAPI (manual)

on:
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: "Recreate pokeapi-data folder (DANGEROUS: deletes ./pokeapi-data)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: setup-pokeapi
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.TWITCH_SERVER_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.TWITCH_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          : > ~/.ssh/known_hosts
          if ssh-keyscan -p "${SSH_PORT}" -T 60 -t rsa,ecdsa,ed25519 "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            && grep -q '^[^#[:space:]]' ~/.ssh/known_hosts; then
            :
          elif [ -n "${SERVER_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::error::No host keys found."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p \"$REMOTE_PATH\""

      - name: Upload twitch compose (for pokeapi service)
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            docker-compose.twitch.yml "$SSH_USER@$SSH_HOST:$REMOTE_PATH/docker-compose.twitch.yml"

      - name: Upload twitch .env
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
          TWITCH_ENV_FILE: ${{ secrets.TWITCH_ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TWITCH_ENV_FILE" > .twitch.env
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            .twitch.env "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.env"
          rm -f .twitch.env

      - name: Prepare PokeAPI CSV data then run migrations + build_all
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
          REBUILD_DATA: ${{ inputs.rebuild_data }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "REMOTE_PATH='${REMOTE_PATH}' REBUILD_DATA='${REBUILD_DATA}' bash -se" <<'EOF'
          set -euo pipefail
          cd "$REMOTE_PATH"

          ls

          # Cleanup any leftover temp dirs in deploy folder
          for d in ./*-temp ./*.tmp; do
            if [ -d "$d" ]; then
              rm -rf "$d"
            fi
          done

          if [ "${REBUILD_DATA:-false}" = "true" ]; then
            rm -rf ./pokeapi-data
          fi

          # BEGIN: commands you provided (order matters)
          git clone --depth 1 https://github.com/PokeAPI/pokeapi.git ./pokeapi-temp
          mkdir -p ./pokeapi-data/data/v2/csv
          cp -r ./pokeapi-temp/data/v2/csv/* ./pokeapi-data/data/v2/csv/
          ls ./pokeapi-data/data/v2/csv | head -n 20
          # END: commands you provided

          docker compose -f docker-compose.twitch.yml up -d pokeapi --pull missing

          docker exec pokeapi python manage.py migrate --settings=config.docker-compose
          docker exec -T pokeapi python manage.py shell --settings=config.docker-compose <<'PY'
          from data.v2.build import build_all
          build_all()
          PY

          rm -rf ./pokeapi-temp
          EOF

      - name: Show logs on failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<'EOF'
          cd "$REMOTE_PATH" || exit 0
          docker compose -f docker-compose.twitch.yml ps || true
          docker compose -f docker-compose.twitch.yml logs --tail=200 pokeapi || true
          EOF
