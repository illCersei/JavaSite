# Инициализация данных PokeAPI по POKEAPI.md.
# Логика: scripts/pokeapi-setup-server.sh (клон CSV → migrate → build_all → rm папки).
name: PokeAPI DB setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pokeapi-migrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_PORT: ${{ secrets.SERVER_PORT }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}

    steps:
      - name: Checkout (актуальный scripts/pokeapi-setup-server.sh)
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY is not a valid private key."
            exit 1
          fi
          : > ~/.ssh/known_hosts
          if ssh-keyscan -p "${SSH_PORT}" -T 60 -t rsa,ecdsa,ed25519 "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            && grep -q '^[^#[:space:]]' ~/.ssh/known_hosts; then
            :
          elif [ -n "${SERVER_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::error::No host keys."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload script and run on server
        run: |
          set -euo pipefail
          ssh -T \
            -o BatchMode=yes \
            -i ~/.ssh/id_ed25519 \
            -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${REMOTE_PATH}/scripts'"

          scp -o BatchMode=yes \
            -i ~/.ssh/id_ed25519 \
            -P "${SSH_PORT}" \
            scripts/pokeapi-setup-server.sh \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/scripts/pokeapi-setup-server.sh"

          ssh -T \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i ~/.ssh/id_ed25519 \
            -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "chmod +x '${REMOTE_PATH}/scripts/pokeapi-setup-server.sh' && cd '${REMOTE_PATH}' && ./scripts/pokeapi-setup-server.sh"
