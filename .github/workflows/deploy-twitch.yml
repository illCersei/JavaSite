name: Deploy Twitch Stack

on:
  push:
    branches:
      - main
    paths:
      - 'twitchService/**'
      - 'pom.xml'
      - 'docker-compose.twitch.yml'
      - '.github/workflows/deploy-twitch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-twitch-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build twitch jar
        run: |
          mvn -B package -DskipTests -pl twitchService -am

      - name: Upload twitch jar
        uses: actions/upload-artifact@v4
        with:
          name: twitch-jar
          retention-days: 1
          path: twitchService/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60

    env:
      SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
      SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
      SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
      REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
      SERVER_KNOWN_HOSTS: ${{ secrets.TWITCH_SERVER_KNOWN_HOSTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download twitch jar
        uses: actions/download-artifact@v4
        with:
          name: twitch-jar
          path: twitchService/target

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh

          printf '%s\n' "${{ secrets.TWITCH_SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::TWITCH_SERVER_SSH_KEY is not a valid private key."
            exit 1
          fi

          : > ~/.ssh/known_hosts
          if ssh-keyscan -p "${SSH_PORT}" -T 60 -t rsa,ecdsa,ed25519 "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            && grep -q '^[^#[:space:]]' ~/.ssh/known_hosts; then
            :
          elif [ -n "${SERVER_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::error::No host keys: ssh-keyscan failed and TWITCH_SERVER_KNOWN_HOSTS is empty."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p \"$REMOTE_PATH\""

      - name: Sync twitch repository and jar to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.idea' \
            --exclude '.DS_Store' \
            --exclude 'logs' \
            -e "ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Upload twitch .env
        env:
          TWITCH_ENV_FILE: ${{ secrets.TWITCH_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${TWITCH_ENV_FILE}" ]; then
            echo "TWITCH_ENV_FILE secret not set; skipping .env upload"
            exit 0
          fi

          printf '%s\n' "$TWITCH_ENV_FILE" > .twitch.env
          rsync -az \
            -e "ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            .twitch.env "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.env"
          rm -f .twitch.env

      - name: Deploy twitch stack with Docker Compose
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PATH"

          mkdir -p logs/twitch

          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          export COMPOSE_PROGRESS=plain

          COMPOSE_FILE="docker-compose.twitch.yml"
          SERVICES="redis twitch_service"

          echo "== Free disk (before build) =="
          docker builder prune -af || true
          docker image prune -f || true

          echo "== Stop/remove old twitch containers =="
          docker compose -f "\$COMPOSE_FILE" stop \$SERVICES || true
          docker compose -f "\$COMPOSE_FILE" rm -f \$SERVICES || true

          echo "== Rebuild & start twitch stack =="
          docker compose -f "\$COMPOSE_FILE" up -d --build --no-deps --force-recreate twitch_service
          docker compose -f "\$COMPOSE_FILE" up -d redis

          docker compose -f "\$COMPOSE_FILE" ps
          EOF

      - name: Show twitch logs on failure
        if: failure()
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          cd "$REMOTE_PATH" || exit 0
          docker compose -f docker-compose.twitch.yml logs --tail=200
          EOF