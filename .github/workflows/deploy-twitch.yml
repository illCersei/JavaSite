name: Deploy Twitch Stack

on:
  push:
    branches: [ main ]
    paths:
      - 'twitchService/**'
      - 'pom.xml'
      - 'docker-compose.twitch.yml'
      - '.github/workflows/deploy-twitch.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-twitch-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run twitch tests
        run: mvn -B test -pl twitchService -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 14
          if-no-files-found: ignore

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60

    env:
      IMAGE_NAME: twitch-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build twitch jar
        run: mvn -B package -DskipTests -pl twitchService -am

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push twitch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: twitchService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:main
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.TWITCH_SERVER_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.TWITCH_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          : > ~/.ssh/known_hosts
          if ssh-keyscan -p "${SSH_PORT}" -T 60 -t rsa,ecdsa,ed25519 "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            && grep -q '^[^#[:space:]]' ~/.ssh/known_hosts; then
            :
          elif [ -n "${SERVER_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::error::No host keys found."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p \"$REMOTE_PATH\""

      - name: Upload twitch compose
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            docker-compose.twitch.yml "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Upload twitch .env
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
          TWITCH_ENV_FILE: ${{ secrets.TWITCH_ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TWITCH_ENV_FILE" > .twitch.env
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            .twitch.env "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.env"
          rm -f .twitch.env

      - name: Deploy twitch stack
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PATH"

          mkdir -p logs/twitch
          chmod -R 777 logs

          echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin

          docker compose -f docker-compose.twitch.yml pull twitch-service
          docker compose -f docker-compose.twitch.yml up -d redis
          docker compose -f docker-compose.twitch.yml up -d twitch-service

          docker compose -f docker-compose.twitch.yml ps
          EOF

      - name: Verify twitch stack is healthy
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PATH"
          for i in \$(seq 1 36); do
            cid=\$(docker compose -f docker-compose.twitch.yml ps -q twitch-service)
            if [ -z "\$cid" ]; then
              echo "waiting: twitch-service container not found"
              sleep 5
              continue
            fi
            status=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "\$cid")
            if [ "\$status" = "healthy" ] || [ "\$status" = "none" ]; then
              echo "twitch-service healthy"
              exit 0
            fi
            echo "waiting: twitch-service:\$status"
            sleep 5
          done
          echo "timed out waiting for twitch-service to become healthy"
          exit 1
          EOF

      - name: Show twitch logs on failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.TWITCH_SERVER_HOST }}
          SSH_PORT: ${{ secrets.TWITCH_SERVER_PORT }}
          SSH_USER: ${{ secrets.TWITCH_SERVER_USER }}
          REMOTE_PATH: ${{ secrets.TWITCH_REMOTE_PATH }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          cd "$REMOTE_PATH" || exit 0
          docker compose -f docker-compose.twitch.yml logs --tail=200
          EOF
