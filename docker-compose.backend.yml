services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - monitoring_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    mem_limit: 512m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - default
      - monitoring_net

  kafka:
    image: apache/kafka:latest
    container_name: kafka-container
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${SPRING_KAFKA_HOST}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - default
      - monitoring_net

  auth-service:
    image: ghcr.io/illcersei/auth-service:main
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:${SERVER_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      AUTH_DB_NAME: auth_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/auth_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - rabbitmq
      - kafka
    volumes:
      - ./logs/auth:/app/logs
    networks:
      default:
      monitoring_net:
        aliases:
          - auth-service

  test-api:
    image: ghcr.io/illcersei/test-api:main
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:${SERVER_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
    depends_on:
      - rabbitmq
    volumes:
      - ./logs/test-api:/app/logs
    networks:
      default:
      monitoring_net:
        aliases:
          - test-service

  profile-service:
    image: ghcr.io/illcersei/profile-service:main
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:${SERVER_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      PROFILE_DB_NAME: profile_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/profile_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - kafka
    volumes:
      - ./logs/profile:/app/logs
    networks:
      default:
      monitoring_net:
        aliases:
          - profile-service

  wallet-service:
    image: ghcr.io/illcersei/wallet-service:main
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8005:${SERVER_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      WALLET_DB_NAME: wallet_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/wallet_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
      WALLET_KAFKA_LISTENER_ENABLED: "false"
      WALLET_ALLOW_ARBITRARY_CREDIT_DEBIT: "false"
      WALLET_SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN}
    depends_on:
      - kafka
    volumes:
      - ./logs/wallet:/app/logs
    networks:
      default:
      monitoring_net:
        aliases:
          - wallet-service

  octopus-service:
    image: ghcr.io/illcersei/octopus-service:main
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8006:${SERVER_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      JWT_SECRET: ${JWT_SECRET}
      OCTOPUS_DB_NAME: octopus_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/octopus_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      OCTOPUS_FIGHT_BASE_URL: http://fight-service:${FIGHT_SERVER_PORT}
      OCTOPUS_FIGHT_PUBLIC_BASE_URL: https://gorelov.net
      OCTOPUS_SPRITE_URL_TEMPLATE: https://gorelov.net/api/v1/octopus/images/octopus/%d.png
      WALLET_BASE_URL: http://wallet-service:${SERVER_PORT}
      WALLET_SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      wallet-service:
        condition: service_started
    volumes:
      - ./logs/octopus:/app/logs
    networks:
      default:
      monitoring_net:
        aliases:
          - octopus-service

  fight-service:
    image: ghcr.io/illcersei/fight-service:main
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FIGHT_SERVER_PORT}:${FIGHT_SERVER_PORT}"
    environment:
      ASPNETCORE_URLS: http://+:${FIGHT_SERVER_PORT}
      ConnectionStrings__FightDb: Host=${DB_HOST};Port=${DB_PORT};Database=fight_db;Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Metrics__Username: ${METRICS_USERNAME}
      Metrics__Password: ${METRICS_PASSWORD}
    networks:
      default:
      monitoring_net:
        aliases:
          - fight-service

volumes:
  redis_data:
  rabbitmq_data:
  kafka_data:

networks:
  monitoring_net:
    external: true