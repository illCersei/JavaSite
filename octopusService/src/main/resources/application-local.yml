spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: octopusService

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/octopus_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-target: build/generated-schema.sql
            create-source: metadata


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mvc:
    servlet:
      path: /api/v1/octopus

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: localhost:${SPRING_KAFKA_PORT}
    consumer:
      group-id: octopus-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false

management:
  server:
    port: ${OCTOPUS_MONITORING_PORT:10006}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

metrics:
  username: ${METRICS_USERNAME}
  password: ${METRICS_PASSWORD}

server:
  port: ${OCTOPUS_SERVER_PORT:8006}

wallet:
  base-url: http://localhost:${WALLET_SERVER_PORT:8005}

octopus:
  instance-id: ${OCTOPUS_INSTANCE_ID:}
  sprite-url-template: ${OCTOPUS_SPRITE_URL_TEMPLATE:http://localhost:${OCTOPUS_SERVER_PORT:8006}/api/v1/octopus/images/octopus/%d.png}
  gacha:
    cost-minor: ${OCTOPUS_GACHA_COST_MINOR:100}
    max-template-id: ${OCTOPUS_GACHA_MAX_TEMPLATE_ID:6}
  loot:
    tier-weights:
      1: ${OCTOPUS_LOOT_TIER_1_WEIGHT:70}
      2: ${OCTOPUS_LOOT_TIER_2_WEIGHT:30}
    coin-minor-by-tier:
      1: ${OCTOPUS_LOOT_COIN_TIER_1:50}
      2: ${OCTOPUS_LOOT_COIN_TIER_2:150}
  kafka:
    gacha-events-topic: ${OCTOPUS_KAFKA_GACHA_TOPIC:octopus.gacha.events}
  fight:
    base-url: http://localhost:22822

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework: info
    cersei.octopusservice: info
  file:
    name: logs/octopusservice.log
