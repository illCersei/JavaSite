services:
  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_container
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    mem_limit: 512m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  kafka:
    image: apache/kafka:latest
    container_name: kafka_container
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_container:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka_container:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  pokeapi:
    image: pokeapi/pokeapi:master
    container_name: pokeapi
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:80"
    environment:
      POSTGRES_DB: ${POKEAPI_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
      REDIS_CONNECTION_STRING: redis://redis_container:${SPRING_DATA_REDIS_PORT}/0
    volumes:
      - ./pokeapi-data/data/v2/csv:/code/data/v2/csv:ro
    depends_on:
      - redis

  auth_service:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: auth_service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/twitch_monitor
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - rabbitmq
      - kafka
    volumes:
      - ./logs/auth:/app/logs

  twitch_service:
    build:
      context: .
      dockerfile: twitchService/Dockerfile
    container_name: twitch_service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/twitch_monitor
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs/twitch:/app/logs

  test_api:
    build:
      context: .
      dockerfile: testApi/Dockerfile
    container_name: test_api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
    depends_on:
      - rabbitmq
    volumes:
      - ./logs/test_api:/app/logs

  profile_service:
    build:
      context: .
      dockerfile: profile/Dockerfile
    container_name: profile_service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/twitch_monitor
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - kafka
    volumes:
      - ./logs/profile:/app/logs

  wallet_service:
    build:
      context: .
      dockerfile: wallet/Dockerfile
    container_name: wallet_service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8005:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/twitch_monitor
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
      WALLET_KAFKA_LISTENER_ENABLED: "true"
      WALLET_ALLOW_ARBITRARY_CREDIT_DEBIT: "true"
    depends_on:
      - kafka
    volumes:
      - ./logs/wallet:/app/logs

  pokemon_service:
    build:
      context: .
      dockerfile: pokemonService/Dockerfile
    container_name: pokemon_service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8006:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/twitch_monitor
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis_container
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      POKEAPI_BASE_URL: http://pokeapi
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      pokeapi:
        condition: service_started
      wallet_service:
        condition: service_started
    volumes:
      - ./logs/pokemon:/app/logs

volumes:
  redis_data:
  rabbitmq_data:
  kafka_data: