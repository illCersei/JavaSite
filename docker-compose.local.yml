services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_DB: twitch_monitor
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d twitch_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: redis-container
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-container
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    mem_limit: 512m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  kafka:
    image: apache/kafka:latest
    container_name: kafka-container
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-container:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-container:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  auth-service:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: auth-service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:${SERVER_PORT}"
      - "9001:${MONITORING_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      AUTH_DB_NAME: auth_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${DB_PORT}/auth_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    volumes:
      - ./logs/auth:/app/logs

  twitch-service:
    build:
      context: .
      dockerfile: twitchService/Dockerfile
    container_name: twitch-service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:${SERVER_PORT}"
      - "9002:${MONITORING_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      TWITCH_DB_NAME: twitch_monitor
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${DB_PORT}/twitch_monitor
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis-container
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs/twitch:/app/logs

  test-api:
    build:
      context: .
      dockerfile: testApi/Dockerfile
    container_name: test-api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:${SERVER_PORT}"
      - "9003:${MONITORING_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_started
    volumes:
      - ./logs/test-api:/app/logs

  profile-service:
    build:
      context: .
      dockerfile: profile/Dockerfile
    container_name: profile-service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:${SERVER_PORT}"
      - "9004:${MONITORING_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      PROFILE_DB_NAME: profile_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${DB_PORT}/profile_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ./logs/profile:/app/logs

  wallet-service:
    build:
      context: .
      dockerfile: wallet/Dockerfile
    container_name: wallet-service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8005:${SERVER_PORT}"
      - "9005:${MONITORING_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      WALLET_DB_NAME: wallet_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${DB_PORT}/wallet_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
      # Kafka credit/debit command channel has no in-repo producer and only checks
      # JWT ownership (no role/cost gate) - keep it off until something actually
      # needs it. Arbitrary direct credit/debit is admin-only by design (see
      # WalletSecurityProperties) - do not flip these back to "true" without also
      # adding a real authorization story for whichever caller needs them.
      WALLET_KAFKA_LISTENER_ENABLED: "false"
      WALLET_ALLOW_ARBITRARY_CREDIT_DEBIT: "false"
      WALLET_SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ./logs/wallet:/app/logs

  octopus-service:
    build:
      context: .
      dockerfile: octopusService/Dockerfile
    container_name: octopus-service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8006:${SERVER_PORT}"
      - "9006:${MONITORING_PORT}"
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      MONITORING_PORT: ${MONITORING_PORT}
      SERVER_PORT: ${SERVER_PORT}
      JWT_SECRET: ${JWT_SECRET}
      OCTOPUS_DB_NAME: octopus_db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${DB_PORT}/octopus_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis-container
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_KAFKA_PORT: ${SPRING_KAFKA_PORT}
      OCTOPUS_FIGHT_BASE_URL: http://fight-service:${FIGHT_SERVER_PORT}
      # OCTOPUS_FIGHT_BASE_URL above is for octopus-service's own server-to-server
      # call to start a fight - only octopus-service needs to resolve that hostname.
      # This one is echoed back to the browser (DungeonStartFightDto.fightServiceUrl)
      # for the live turn loop, so it must be host-mapped, not the container DNS name.
      OCTOPUS_FIGHT_PUBLIC_BASE_URL: http://localhost:${FIGHT_SERVER_PORT}
      # wallet-service listens internally on the shared SERVER_PORT (8000), not its
      # host-mapped port (8005) - application.yml's default assumes the old
      # per-service-port convention and is wrong for docker-compose.
      WALLET_BASE_URL: http://wallet-service:${SERVER_PORT}
      WALLET_SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN}
      # This URL goes into API responses and is loaded by the browser, not called
      # container-to-container - it must use the host-mapped port (8006), not the
      # internal service DNS name/port. Without this override, application.yml's
      # base-profile default points at PokeAPI's pokemon sprites on GitHub.
      OCTOPUS_SPRITE_URL_TEMPLATE: http://localhost:8006/api/v1/octopus/images/octopus/%d.png
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      wallet-service:
        condition: service_started
      fight-service:
        condition: service_started
    volumes:
      - ./logs/octopus:/app/logs

  fight-service:
    build:
      context: .
      dockerfile: fightService/Dockerfile
    container_name: fight-service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FIGHT_SERVER_PORT}:${FIGHT_SERVER_PORT}"
    environment:
      ASPNETCORE_URLS: http://+:${FIGHT_SERVER_PORT}
      ConnectionStrings__FightDb: Host=postgres;Port=${DB_PORT};Database=fight_db;Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
